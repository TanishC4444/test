name: Offline checks
on:
  push:
    paths:
      - '**.py'
      - 'templates/**'
      - '.github/workflows/offline-checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check local behavior without live services
        run: python -m unittest test_store -v
